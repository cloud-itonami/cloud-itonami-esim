name: CI

# deps.edn names every dependency by git coordinate, so this workflow needs no
# sibling checkouts -- and that is the point: it therefore proves the actor is
# consumable (forkable, deployable) rather than only that it compiles next to
# its siblings in a monorepo. It used to check out five siblings, which made CI
# green while a fork one directory away could not build a classpath at all.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: clj-kondo (errors fail the build)
        run: kbb -M:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - name: test (includes the HTTP surface on a real socket)
        run: kbb -M:test
      - name: demo runner (compiled StateGraph, end-to-end)
        run: kbb -M:run
